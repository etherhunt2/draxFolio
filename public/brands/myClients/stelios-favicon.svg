<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5772">
        <animate attributeName="stop-color" 
                 values="#1a5772;#2563eb;#1a5772" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#2B5A7A">
        <animate attributeName="stop-color" 
                 values="#2B5A7A;#3b82f6;#2B5A7A" 
                 dur="4s" 
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="faviconGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="faviconShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Refined S Favicon -->
  <g transform="translate(30,30)" style="cursor: pointer;">
    <!-- Main elegant S shape -->
    <path d="M 0,-22
             C 10,-22 16,-17 18,-11
             C 19,-8 18,-6 16,-5
             C 14,-4 12,-4 11,-6
             C 10,-7 11,-8 12,-8
             C 13,-8 14,-7 14,-6
             C 14,-2 11,1 8,3
             C 5,5 3,7 4,9
             C 5,11 7,11 8,10
             C 9,9 10,10 11,11
             C 12,12 11,13 10,13
             C 8,13 6,12 5,10
             C 4,8 5,6 7,4
             C 9,2 12,0 13,-2
             C 15,-5 14,-8 12,-9
             C 10,-11 7,-11 4,-10
             C 1,-9 0,-7 1,-5
             C 2,-3 3,-4 3,-6
             C 3,-7 2,-8 1,-8
             C 0,-8 -1,-7 -1,-5
             C -1,-2 1,0 3,1
             L 3,2
             C -1,0 -4,-3 -4,-7
             C -4,-12 -1,-16 3,-18
             C 6,-20 9,-20 12,-19
             Z" 
          fill="url(#faviconGradient)" 
          filter="url(#faviconShadow)">
      
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0;5;0;-5;0"
        dur="6s"
        repeatCount="indefinite"/>
    </path>
    
    <!-- Inner highlight -->
    <path d="M 2,-17
             C 6,-17 9,-15 10,-12
             C 11,-10 10,-9 9,-9
             C 8,-9 7,-10 8,-11
             C 9,-12 7,-13 5,-13
             C 3,-13 2,-12 2,-10
             C 2,-9 3,-8 4,-8
             C 6,-8 8,-7 9,-5
             C 10,-3 9,-2 8,-2
             C 7,-2 6,-3 6,-4
             C 6,-5 7,-6 8,-6
             C 9,-6 10,-5 10,-4
             C 10,-1 8,1 6,2
             Z" 
          fill="rgba(255,255,255,0.5)" 
          opacity="0.9">
      
      <animate attributeName="opacity" 
               values="0.4;0.9;0.4" 
               dur="3s" 
               repeatCount="indefinite"/>
    </path>
  </g>
  
  <style>
    <![CDATA[
      svg:hover path {
        filter: url(#faviconGlow);
        transform: scale(1.1);
      }
    ]]>
  </style>
</svg>

